name: Release

on:
  push:
    tags: ["v*"]
  # After a failed publish (for example a trusted publisher that is not configured yet) re-run the
  # workflow from the Actions tab, which is this dispatch entry, instead of deleting and re-pushing the tag.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later; Node 22 still ships npm 10.
      - run: npm install --global npm@11
      - name: Check the tag matches the package version
        if: github.event_name == 'push'
        run: |
          node --input-type=commonjs -e '
            const version = require("./package.json").version
            const tag = process.env.GITHUB_REF_NAME
            if (tag !== `v${version}`) {
              console.error(`tag ${tag} does not match package version v${version}`)
              process.exit(1)
            }
          '
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist
      # The first version is published by hand, so a tag for it is allowed to go up afterwards.
      - name: Check whether this version is already on the registry
        id: registry
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "opencode-glance@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::opencode-glance@$version already exists; skipping npm publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.registry.outputs.published != 'true'
        run: npm publish --provenance --access public
